name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history scan to catch anything that slips past PR/push checks
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so gitleaks can scan past commits,
          # not just the current diff.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
