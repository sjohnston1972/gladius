services:
  gladius-pyats:
    container_name: gladius-pyats
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - net_core
    volumes:
      - ./app.py:/app/app.py
      - ./data:/data
    env_file:
      - .env
      - ../network-audit-mcp/.env
      - ../gladius-api/.env
    # No host port publish — reached only via nginx on net_core, which is
    # the single front door gated by Cloudflare Access.

networks:
  net_core:
    external: true
