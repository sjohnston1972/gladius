# HAProxy config for docker-socket-proxy-api (mounted over the image's
# /usr/local/etc/haproxy/haproxy.cfg.template; the image entrypoint only
# substitutes ${BIND_CONFIG}, everything else is plain HAProxy config).
#
# gladius-api's only Docker need is `docker exec -i <mcp container> python
# /app/server.py` (MCP_COMMAND / MCP_ARGS / MCP_PENTEST_ARGS in
# gladius-api/server.py). The stock tecnativa template can't express that:
# EXEC needs POST=1, and POST=1 + CONTAINERS=1 also allows
# /containers/create, /start, /kill, /delete and inspect of every container.
# This allowlist permits exactly the calls the docker CLI makes for that one
# command, and only against the containers named in EXEC_CONTAINERS:
#
#   HEAD|GET /_ping, GET /version            API version negotiation
#   GET  /containers/<allowed>/json          CLI pre-check before exec
#   POST /containers/<allowed>/exec          create the exec instance
#   POST /exec/<id>/start | /exec/<id>/resize  attach to it
#   GET  /exec/<id>/json                     read its exit code
#
# Everything else gets 403. Patterns avoid backslashes because HAProxy
# processes escapes inside double-quoted strings (needed for ${VAR}).

global
    log stdout format raw daemon "${LOG_LEVEL}"

    pidfile /run/haproxy.pid
    maxconn 4000

    server-state-file /var/lib/haproxy/server-state

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    # gladius-api keeps one persistent `docker exec -i` stdio session per MCP
    # server (MCPManager). Once the exec stream is upgraded it is a tunnel;
    # without this, an idle session (or a long silent nmap run) would be cut
    # after the 10m client/server timeouts above.
    timeout tunnel 1d
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

    load-server-state-from-file global

    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

backend dockerbackend
    server dockersocket $SOCKET_PATH

frontend dockerfrontend
    bind ${BIND_CONFIG}

    http-request allow if METH_GET  { path,url_dec -m reg "^(/v[0-9.]+)?/(_ping|version)$" }
    http-request allow if METH_GET  { path,url_dec -m reg "^(/v[0-9.]+)?/containers/(${EXEC_CONTAINERS-network-audit-mcp|gladius-pentest-mcp})/json$" }
    http-request allow if METH_POST { path,url_dec -m reg "^(/v[0-9.]+)?/containers/(${EXEC_CONTAINERS-network-audit-mcp|gladius-pentest-mcp})/exec$" }
    http-request allow if METH_POST { path,url_dec -m reg "^(/v[0-9.]+)?/exec/[a-f0-9]+/(start|resize)$" }
    http-request allow if METH_GET  { path,url_dec -m reg "^(/v[0-9.]+)?/exec/[a-f0-9]+/json$" }
    http-request deny

    default_backend dockerbackend
