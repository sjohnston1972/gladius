# HAProxy config for docker-socket-proxy-overseer (mounted over the image's
# /usr/local/etc/haproxy/haproxy.cfg.template; the image entrypoint only
# substitutes ${BIND_CONFIG}, everything else is plain HAProxy config).
#
# gladius-overseer's only Docker need is `docker restart <name>` for the
# fixed ALLOWED_CONTAINERS set in gladius-overseer/app.py. In the stock
# tecnativa template the POST gate is evaluated before ALLOW_RESTARTS, so
# restarts need POST=1 — and POST=1 + CONTAINERS=1 also allows create,
# start, exec-create, kill, delete and inspect (env + cmd) of every
# container. This allowlist permits only:
#
#   HEAD|GET /_ping, GET /version              API version negotiation
#   POST /containers/<allowed>/restart         the restart itself
#
# for the names in RESTART_CONTAINERS (keep it in sync with
# ALLOWED_CONTAINERS). Everything else, including GET /containers/*/json,
# gets 403. Patterns avoid backslashes because HAProxy processes escapes
# inside double-quoted strings (needed for ${VAR}).

global
    log stdout format raw daemon "${LOG_LEVEL}"

    pidfile /run/haproxy.pid
    maxconn 4000

    server-state-file /var/lib/haproxy/server-state

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

    load-server-state-from-file global

    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

backend dockerbackend
    server dockersocket $SOCKET_PATH

frontend dockerfrontend
    bind ${BIND_CONFIG}

    http-request allow if METH_GET  { path,url_dec -m reg "^(/v[0-9.]+)?/(_ping|version)$" }
    http-request allow if METH_POST { path,url_dec -m reg "^(/v[0-9.]+)?/containers/(${RESTART_CONTAINERS-gladius-api|gladius-overseer|gladius-pentest-mcp|gladius-pyats|gladius-slack|gladius-snmp|network-audit-mcp})/restart$" }
    http-request deny

    default_backend dockerbackend
