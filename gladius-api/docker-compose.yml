services:
  gladius-api:
    container_name: gladius-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - net_core
    volumes:
      - ./server.py:/app/server.py
    # No docker.sock mount, and no DOCKER_HOST here — the MCP client library
    # spawns `docker exec` with a filtered environment that drops DOCKER_HOST,
    # so the docker CLI is instead pointed at the restricted
    # docker-socket-proxy-api service via a docker context baked into the
    # image at build time (see Dockerfile). Requires docker-socket-proxy/
    # to be up and reachable on net_core before this service starts.
    env_file:
      - .env
    # No host port publish — reached only via nginx on net_core, which is
    # the single front door gated by Cloudflare Access.

networks:
  net_core:
    external: true
